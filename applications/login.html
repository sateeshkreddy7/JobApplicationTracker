<!DOCTYPE html>
<html>
<head>
    <title>Login - Job Application Tracker</title>
</head>

<body>

    <h1>Login</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="/register/">Register</a>
    </p>

</body>
</html>
